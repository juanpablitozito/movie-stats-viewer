<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101113">
  <title>Entrar · Movie Stats Viewer</title>
  <link rel="icon" href="/static/img/favicon-stat.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-stat-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-stat-16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="login-layout">
    <section class="form-panel" aria-labelledby="login-title">
      <div class="form-card">
        <img class="login-logo" src="/static/img/logo_stat-matte.png" alt="Logo do Stat: claquete de cinema" width="96" height="96">
        <span class="form-kicker">BEM-VINDO AO STAT</span>
        <h2 id="login-title">Movie Stats Viewer</h2>
        <p class="form-description">Sua experiência cinematográfica começa aqui.</p>
        {% if mensagem %}<div role="alert" class="login-error">{{ mensagem }}</div>{% endif %}
        <form class="login" method="POST" action="/login">
          <div class="field"><label for="usuario">Usuário</label><input id="usuario" name="usuario" type="text" placeholder="Digite seu usuário" autocomplete="username" value="{{ request.form.get('usuario', '') }}" required></div>
          <div class="field"><label for="password">Senha</label><div class="password-field"><input id="password" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required><button id="togglePassword" type="button" aria-controls="password" aria-pressed="false">Mostrar</button></div></div>
          <p id="capsWarning" class="caps-warning" hidden>Caps Lock está ativado.</p>
          <button class="btn-acesso" type="submit">Entrar na minha conta <span aria-hidden="true">↗</span></button>
        </form>
        <p class="form-note">Prepare a pipoca. A gente cuida da descoberta.</p>
      </div>
      <p class="login-credit">MOVIE STATS VIEWER <span>Feito por Daniel & Juan</span></p>
    </section>
  </main>
  <script src="/static/js/login.js"></script>
</body>
</html>
